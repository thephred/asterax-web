<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>zokol pixels</title>
    <style>
        html, body { margin: 0; height: 100%; background: #222; }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h1, p, div.info {
            flex-shrink: 0;
            color: #eeeeee;
        }

        h1 {
            padding: 15px;
            padding-bottom: 0;
            margin: 0;
        }

        div.info {
            display: flex;
            flex-wrap: wrap;
            padding: 15px;
            gap: 15px;
        }

        div.info p {
            padding: 0;
            margin: 0;
        }

        p.footer {
            padding: 0 15px;
        }

        div.game {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script type="module">
      import { startZokol } from "./asterax.js";

      window.addEventListener('DOMContentLoaded', async () => {
          const canvas = document.getElementById('canvas');
          if (canvas) await startZokol("asterax.wasm", { canvas });
      });
    </script>
</head>
<body>
    <h1>Modern Asterax Game Progress Demo</h1>
    <div class="info">
        <p>You can use the arrow keys to spin and thrust.</p>
        <p>Space will cycle through the ships and set the engine to the ships default.</p>
        <p>The 'e' key cycles throuugh the engines.</p>
    </div>
    <div class="game"><canvas id="canvas"></canvas></div>
    <p class="footer">© Michael Goff</p>
</body>
</html>
